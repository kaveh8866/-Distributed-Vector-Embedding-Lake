[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-vector-embedding-lake"
version = "0.1.0"
description = "Distributed vector and embedding lake for large-scale RAG: Qdrant storage, embedding ingestion workers, retrieval APIs and evaluation loops."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mostafa Kaveh", email = "82622243+kaveh8866@users.noreply.github.com" }]
dependencies = [
  # Pinned to the server minor: qdrant warns when client and server differ by
  # more than one minor version, and rejects a major mismatch.
  "qdrant-client>=1.12,<1.13",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6.0,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.2,<4"]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1"]

[project.scripts]
vlake-ingest = "vlake.ingestion:main"
vlake-search = "vlake.search:main"
vlake-eval = "vlake.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlake = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
